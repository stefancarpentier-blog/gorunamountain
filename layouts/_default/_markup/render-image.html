<div style="display: inline-block; vertical-align: top; width: 100%; max-width: 48%; margin: 8px 1%; text-align: center;">
  <img src="{{ .Destination | safeURL }}" alt="{{ .Text }}" {{ with .Title }}title="{{ . }}"{{ end }} loading="lazy" decoding="async" style="width: 100%; height: auto; border-radius: 4px;" />
  {{ with .Text }}
    <span style="display: block; font-size: 0.85em; opacity: 0.8; margin-top: 6px; text-align: center;">{{ . }}</span>
  {{ end }}
</div>
